# Runs on the desktop. Pulls from the Pi over gRPC and shows the dashboard.
# Usage: PI_TARGETS=172.31.227.194:50051 docker compose up -d --build   (or ./run.sh, which prompts for the Pi IP)
# Stop:  docker compose down        Wipe data too: docker compose down -v
services:
  grpc-bridge:
    build:
      context: ..
      dockerfile: desktop/bridge/Dockerfile
    container_name: grpc-bridge
    restart: unless-stopped
    ports:
      - "9110:9110"   # browser loads the image panel page from here
    environment:
      PI_TARGETS: ${PI_TARGETS:-172.31.227.194:50051}   # comma-separated host:port list
    volumes:
      - ./images:/images:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - grpc-bridge
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"   # lets the HTML image panel embed an iframe
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/raspberry-pi.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
